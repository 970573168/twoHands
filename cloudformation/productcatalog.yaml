AWSTemplateFormatVersion: "2010-09-09"

Description: >
  电子产品目录采集器 + AI API Secret + Yahoo Auction 抓取器 + 分析工作流 + 目录定期扫描器
  支持多 AI 模式切换（Gemini / 豆包 / OpenAI）
  包含递归链接爬虫（增量版）
  所有定时器默认关闭，需手动启用

Parameters:
  # ============ 通用参数 ============
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: 环境名称

  # ============ S3 代码部署参数 ============
  LambdaCodeS3Bucket:
    Type: String
    Description: 已存在的 S3 Bucket 名称，用于存储 Lambda 代码

  LambdaCodeS3Key:
    Type: String
    Default: "productcatalog/lambda.zip"
    Description: S3 中 Lambda 代码的对象键

  # ============ AI 模式选择 ============
  AiMode:
    Type: String
    Default: "doubao"
    AllowedValues:
      - gemini
      - doubao
      - openai
    Description: AI 模式选择

  # ============ Gemini 配置 ============
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Gemini API Key
  GeminiModel:
    Type: String
    Default: "gemini-2.0-flash"
  GeminiUrl:
    Type: String
    Default: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
  GeminiTimeout:
    Type: Number
    Default: 60
  GeminiMaxTokens:
    Type: Number
    Default: 12000

  # ============ 豆包配置 ============
  DoubaoApiKey:
    Type: String
    NoEcho: true
    Default: ""
  DoubaoModel:
    Type: String
    Default: "qwen-plus-character"
  DoubaoUrl:
    Type: String
    Default: "https://ws-8lxmxlbemcgcus5u.ap-northeast-1.maas.aliyuncs.com/compatible-mode/v1/chat/completions"
  DoubaoTimeout:
    Type: Number
    Default: 300
  DoubaoMaxTokens:
    Type: Number
    Default: 12000

  # ============ OpenAI 配置 ============
  OpenaiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenaiModel:
    Type: String
    Default: "gpt-4o-mini"
  OpenaiUrl:
    Type: String
    Default: "https://api.openai.com/v1/chat/completions"
  OpenaiTimeout:
    Type: Number
    Default: 60
  OpenaiMaxTokens:
    Type: Number
    Default: 12000

  # ============ 故障切换配置 ============
  AiFailoverCooldown:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600

  # ============ 主应用参数 ============
  DeployMainApp:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  MaxCategoriesPerRun:
    Type: Number
    Default: 20
  MaxBrandsPerCategory:
    Type: Number
    Default: 20
  MaxModelsPerBrand:
    Type: Number
    Default: 50
  MaxTotalTokens:
    Type: Number
    Default: 250000
  LambdaTimeoutBuffer:
    Type: Number
    Default: 30
  ApiCallDelay:
    Type: Number
    Default: 1
  CategoryLimit:
    Type: Number
    Default: 5
  BrandLimit:
    Type: Number
    Default: 3
  LogRetentionDays:
    Type: Number
    Default: 14
  ProductCatalogDiscoveryIntervalMinutes:
    Type: Number
    Default: 5

  # ============ Yahoo Auction 抓取器参数 ============
  DeployScraper:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  YahooAuctionMaxPages:
    Type: Number
    Default: 1
  YahooAuctionRequestTimeout:
    Type: Number
    Default: 30
  YahooAuctionDebugLogHtml:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  YahooAuctionItemsPerPage:
    Type: Number
    Default: 100

  # ============ 链接搜索爬虫参数 (增量递归版) ============
  DeployLinkCrawler:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 是否部署 Yahoo 拍卖链接采集器（增量版）

  LinkCrawlerScheduleMinutes:
    Type: Number
    Default: 5
    MinValue: 5
    MaxValue: 1440
    Description: EventBridge 定时采集间隔（分钟）

  LinkCrawlerMaxPages:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 500
    Description: 递归爬取最大页面数

  LinkCrawlerMaxDepth:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    Description: 递归爬取最大深度

  LinkCrawlerMaxLinksPerRun:
    Type: Number
    Default: 5000
    MinValue: 100
    MaxValue: 20000
    Description: 单次运行最大保存链接数

  LinkCrawlerMaxAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 20
    Description: 目录队列任务最大尝试次数

  LinkCrawlerRequestInterval:
    Type: Number
    Default: 0.5
    MinValue: 0.1
    MaxValue: 5.0
    Description: 请求间隔（秒）

  LinkCrawlerEnableRecursive:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 是否启用递归爬取

  # ============ Yahoo Auction Analyzer 参数 ============
  ModelParseBatchSize:
    Type: Number
    Default: 25
  ClosedParseBatchSize:
    Type: Number
    Default: 25
  MaxClosedPerModel:
    Type: Number
    Default: 100
  DefaultSearchCount:
    Type: Number
    Default: 100
  MaxActiveItems:
    Type: Number
    Default: 100
  AiRequestTimeout:
    Type: Number
    Default: 300
  AiMaxRetries:
    Type: Number
    Default: 3
  RequestInterval:
    Type: Number
    Default: 1.0
  ExpectedSellingFeeRate:
    Type: Number
    Default: 0.10
  DefaultShippingCost:
    Type: Number
    Default: 1500
  DefaultRepairReserveRate:
    Type: Number
    Default: 0.05
  MinComparableCount:
    Type: Number
    Default: 3
  MaxPriceDeviation:
    Type: Number
    Default: 1.5
  RiskReserveRate:
    Type: Number
    Default: 0.03
  ActiveMaxRatio:
    Type: Number
    Default: 1.0
  FinalCheckBeforeMinutes:
    Type: Number
    Default: 15
  FinalCheckBatchSize:
    Type: Number
    Default: 20
  BuyCandidateReminderEmail:
    Type: String
    Description: 接收 BUY_CANDIDATE 提醒的邮箱地址；部署后必须在该邮箱中确认 AWS SNS 订阅
  BuyMarginThreshold:
    Type: Number
    Default: 0.20
  ReviewMarginThreshold:
    Type: Number
    Default: 0.10
  HighConfidenceComparableCount:
    Type: Number
    Default: 10
  MediumConfidenceComparableCount:
    Type: Number
    Default: 5
  MinRoi:
    Type: Number
    Default: 0.15
  DetailDescMaxChars:
    Type: Number
    Default: 3000
  LogAiRequestJson:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LogAiResponseJson:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  CountdownScanEventJson:
    Type: String
    Default: '{"mode":"countdown","keyword":"","category_id":"2084317598","active_count":100,"closed_count":100}'
    Description: 倒计时扫描定时器传给 YahooAuctionAnalyzer 的 JSON 参数

  # ============ Yahoo Auction 详情抓取参数 ============
  EnableDetailScrape:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  DetailRequestInterval:
    Type: Number
    Default: 0.3
  DetailScrapeMaxItems:
    Type: Number
    Default: 30

  # ============ Catalog Scanner 参数 ============
  DeployCatalogScanner:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  CatalogScannerMaxModels:
    Type: Number
    Default: 10

Conditions:
  CreateGeminiSecret: !Not [!Equals [!Ref GeminiApiKey, ""]]
  CreateDoubaoSecret: !Not [!Equals [!Ref DoubaoApiKey, ""]]
  CreateOpenaiSecret: !Not [!Equals [!Ref OpenaiApiKey, ""]]
  DeployMainAppCondition: !Equals [!Ref DeployMainApp, "true"]
  DeployScraperCondition: !Equals [!Ref DeployScraper, "true"]
  DeployLinkCrawlerCondition: !Equals [!Ref DeployLinkCrawler, "true"]
  DeployCatalogScannerCondition: !And
    - !Equals [!Ref DeployCatalogScanner, "true"]
    - !Condition DeployMainAppCondition
    - !Condition DeployScraperCondition

Resources:
  # ============================================
  # AI API Secrets
  # ============================================
  
  GeminiApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateGeminiSecret
    Properties:
      Name: !Sub "gemini-api-key-${Environment}"
      Description: Gemini API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"GEMINI_API_KEY":"${GeminiApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Gemini

  DoubaoApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDoubaoSecret
    Properties:
      Name: !Sub "doubao-api-key-${Environment}"
      Description: Doubao API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"DOUBAO_API_KEY":"${DoubaoApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Doubao

  OpenaiApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateOpenaiSecret
    Properties:
      Name: !Sub "openai-api-key-${Environment}"
      Description: OpenAI API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"OPENAI_API_KEY":"${OpenaiApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: OpenAI

  # ============================================
  # DynamoDB Tables
  # ============================================

  ProductCatalogTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployMainAppCondition
    Properties:
      TableName: !Sub "ProductCatalog-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: modified_index_pk
          AttributeType: S
        - AttributeName: modified_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modified_index_pk
              KeyType: HASH
            - AttributeName: modified_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: ProductCatalog
        - Key: Environment
          Value: !Ref Environment

  AiTokenUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AiTokenUsage-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: call_id
          AttributeType: S
      KeySchema:
        - AttributeName: call_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: AiTokenUsage
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionLinksTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployLinkCrawlerCondition
    Properties:
      TableName: !Sub "YahooAuctionLinks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: crawl_id
          AttributeType: S
        - AttributeName: source_url
          AttributeType: S
        - AttributeName: crawled_at
          AttributeType: S
        - AttributeName: link_type
          AttributeType: S
        - AttributeName: first_seen_at
          AttributeType: S
        - AttributeName: queue_status
          AttributeType: S
        - AttributeName: queue_priority
          AttributeType: S
      KeySchema:
        - AttributeName: crawl_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SourceUrlIndex
          KeySchema:
            - AttributeName: source_url
              KeyType: HASH
            - AttributeName: crawled_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: link_type-first_seen_at-index
          KeySchema:
            - AttributeName: link_type
              KeyType: HASH
            - AttributeName: first_seen_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - url
              - is_crawled
              - crawl_status
        - IndexName: queue_status-queue_priority-index
          KeySchema:
            - AttributeName: queue_status
              KeyType: HASH
            - AttributeName: queue_priority
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionLinkCrawler
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionClosedTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployScraperCondition
    Properties:
      TableName: !Sub "YahooAuctionItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID
          AttributeType: S
        - AttributeName: modifiedIndexPk
          AttributeType: S
        - AttributeName: modifiedAt
          AttributeType: S
      KeySchema:
        - AttributeName: itemID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modifiedIndexPk
              KeyType: HASH
            - AttributeName: modifiedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionActiveTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployScraperCondition
    Properties:
      TableName: !Sub "YahooAuctionActiveItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID
          AttributeType: S
        - AttributeName: modifiedIndexPk
          AttributeType: S
        - AttributeName: modifiedAt
          AttributeType: S
      KeySchema:
        - AttributeName: itemID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modifiedIndexPk
              KeyType: HASH
            - AttributeName: modifiedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionBuyCandidateTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployScraperCondition
    Properties:
      TableName: !Sub "YahooAuctionBuyCandidates-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID
          AttributeType: S
        - AttributeName: reviewStatus
          AttributeType: S
        - AttributeName: finalCheckAtEpoch
          AttributeType: N
      KeySchema:
        - AttributeName: itemID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_FinalCheck
          KeySchema:
            - AttributeName: reviewStatus
              KeyType: HASH
            - AttributeName: finalCheckAtEpoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionBuyCandidateReminderTopic:
    Type: AWS::SNS::Topic
    Condition: DeployScraperCondition
    Properties:
      TopicName: !Sub "YahooAuctionBuyCandidateReminder-${Environment}"
      DisplayName: Yahoo Auction BUY 候选提醒

  YahooAuctionBuyCandidateEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: DeployScraperCondition
    Properties:
      TopicArn: !Ref YahooAuctionBuyCandidateReminderTopic
      Protocol: email
      Endpoint: !Ref BuyCandidateReminderEmail

  # ============================================
  # Log Groups
  # ============================================

  ProductCatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployMainAppCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/ProductCatalog-Discovery-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployScraperCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionScraper-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionLinkCrawlerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployLinkCrawlerCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionLinkCrawler-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployScraperCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionAnalyzer-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionFinalCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployScraperCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionFinalCheckReminder-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  CatalogScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployCatalogScannerCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/CatalogScanner-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # ============================================
  # IAM Roles
  # ============================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployMainAppCondition
    Properties:
      RoleName: !Sub "ProductCatalog-LambdaRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProductCatalogDiscoveryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBCatalogAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ProductCatalogTable.Arn
                  - !Sub "${ProductCatalogTable.Arn}/index/*"
              - Sid: ReadYahooAuctionCategories
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/YahooAuctionLinks-${Environment}"
              - Sid: WriteTokenUsage
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AiTokenUsageTable.Arn
              - Sid: ReadApiSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:doubao-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai-api-key-${Environment}-*"
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ProductCatalogLogGroup.Arn}:*"

  YahooAuctionScraperRole:
    Type: AWS::IAM::Role
    Condition: DeployScraperCondition
    Properties:
      RoleName: !Sub "YahooAuctionScraper-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionScraperPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt YahooAuctionClosedTable.Arn
                  - !GetAtt YahooAuctionActiveTable.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${YahooAuctionScraperLogGroup.Arn}:*"
                  - !Sub "${YahooAuctionAnalyzerLogGroup.Arn}:*"

  YahooAuctionLinkCrawlerRole:
    Type: AWS::IAM::Role
    Condition: DeployLinkCrawlerCondition
    Properties:
      RoleName: !Sub "YahooAuctionLinkCrawler-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionLinkCrawlerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt YahooAuctionLinksTable.Arn
                  - !Sub "${YahooAuctionLinksTable.Arn}/index/*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${YahooAuctionLinkCrawlerLogGroup.Arn}:*"

  YahooAuctionFinalCheckRole:
    Type: AWS::IAM::Role
    Condition: DeployScraperCondition
    Properties:
      RoleName: !Sub "YahooAuctionFinalCheck-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionFinalCheckPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CandidateAndActiveAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt YahooAuctionBuyCandidateTable.Arn
                  - !Sub "${YahooAuctionBuyCandidateTable.Arn}/index/*"
                  - !GetAtt YahooAuctionActiveTable.Arn
              - Sid: PublishReminder
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref YahooAuctionBuyCandidateReminderTopic
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${YahooAuctionFinalCheckLogGroup.Arn}:*"

  YahooAuctionAnalyzerRole:
    Type: AWS::IAM::Role
    Condition: DeployScraperCondition
    Properties:
      RoleName: !Sub "YahooAuctionAnalyzer-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionAnalyzerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBFullAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt YahooAuctionClosedTable.Arn
                  - !GetAtt YahooAuctionActiveTable.Arn
                  - !GetAtt YahooAuctionBuyCandidateTable.Arn
                  - !Sub "${YahooAuctionBuyCandidateTable.Arn}/index/*"
              - Sid: UpdateProductCatalog
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ProductCatalogTable.Arn
              - Sid: ReadAllApiSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:doubao-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai-api-key-${Environment}-*"
              - Sid: WriteTokenUsage
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AiTokenUsageTable.Arn
              - Sid: PublishCountdownCandidateEmail
                Effect: Allow
                Action:
                  - sns:Publish
                  - sns:ListSubscriptionsByTopic
                Resource: !Ref YahooAuctionBuyCandidateReminderTopic
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${YahooAuctionScraperLogGroup.Arn}:*"
                  - !Sub "${YahooAuctionAnalyzerLogGroup.Arn}:*"

  CatalogScannerRole:
    Type: AWS::IAM::Role
    Condition: DeployCatalogScannerCondition
    Properties:
      RoleName: !Sub "CatalogScanner-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CatalogScannerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ProductCatalogTable.Arn
                  - !Sub "${ProductCatalogTable.Arn}/index/*"
              - Sid: InvokeAnalyzerLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuctionAnalyzerFunction.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CatalogScannerLogGroup.Arn}:*"

  # ============================================
  # Lambda Functions
  # ============================================

  ProductCatalogDiscovery:
    Type: AWS::Lambda::Function
    Condition: DeployMainAppCondition
    DependsOn:
      - ProductCatalogLogGroup
      - LambdaExecutionRole
    Properties:
      FunctionName: !Sub "ProductCatalog-Discovery-${Environment}"
      Description: 使用 Yahoo 爬取品类，并通过 AI 发现品牌和型号
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductCatalogTable
          LINK_CRAWLER_TABLE_NAME: !Sub "YahooAuctionLinks-${Environment}"
          TOKEN_USAGE_TABLE: !Ref AiTokenUsageTable
          ENVIRONMENT: !Ref Environment
          AI_MODE: !Ref AiMode
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_URL: !Ref GeminiUrl
          GEMINI_TIMEOUT: !Ref GeminiTimeout
          GEMINI_MAX_TOKENS: !Ref GeminiMaxTokens
          DOUBAO_MODEL: !Ref DoubaoModel
          DOUBAO_URL: !Ref DoubaoUrl
          DOUBAO_TIMEOUT: !Ref DoubaoTimeout
          DOUBAO_MAX_TOKENS: !Ref DoubaoMaxTokens
          OPENAI_MODEL: !Ref OpenaiModel
          OPENAI_URL: !Ref OpenaiUrl
          OPENAI_TIMEOUT: !Ref OpenaiTimeout
          OPENAI_MAX_TOKENS: !Ref OpenaiMaxTokens
          AI_FAILOVER_COOLDOWN: !Ref AiFailoverCooldown
          MAX_CATEGORIES: !Ref MaxCategoriesPerRun
          MAX_BRANDS: !Ref MaxBrandsPerCategory
          MAX_MODELS: !Ref MaxModelsPerBrand
          MAX_TOTAL_TOKENS: !Ref MaxTotalTokens
          LAMBDA_TIMEOUT_SECONDS: "900"
          LAMBDA_TIMEOUT_BUFFER: !Ref LambdaTimeoutBuffer
          CATEGORY_LIMIT: !Ref CategoryLimit
          BRAND_LIMIT: !Ref BrandLimit
          API_CALL_DELAY: !Ref ApiCallDelay
      Tags:
        - Key: Application
          Value: ProductCatalog
        - Key: Environment
          Value: !Ref Environment

  # 定时器：Product Catalog Discovery - 默认关闭
  ProductCatalogDiscoveryScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployMainAppCondition
    Properties:
      Name: !Sub "ProductCatalog-Discovery-Schedule-${Environment}"
      Description: 每 5 分钟触发产品目录 AI 发现 (默认关闭)
      ScheduleExpression: !Sub "rate(${ProductCatalogDiscoveryIntervalMinutes} minutes)"
      State: DISABLED
      Targets:
        - Arn: !GetAtt ProductCatalogDiscovery.Arn
          Id: ProductCatalogDiscoveryTarget
          Input: '{"source":"aws.events","task_type":"DISCOVER_CATEGORIES"}'

  ProductCatalogDiscoveryInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployMainAppCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductCatalogDiscovery
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProductCatalogDiscoveryScheduleRule.Arn

  YahooAuctionScraper:
    Type: AWS::Lambda::Function
    Condition: DeployScraperCondition
    DependsOn:
      - YahooAuctionScraperLogGroup
      - YahooAuctionScraperRole
    Properties:
      FunctionName: !Sub "YahooAuctionScraper-${Environment}"
      Description: Yahoo Auction 搜索抓取器
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: yahoo_auction_scraper.lambda_handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt YahooAuctionScraperRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          MAX_PAGES: !Ref YahooAuctionMaxPages
          REQUEST_TIMEOUT: !Ref YahooAuctionRequestTimeout
          DEBUG_LOG_HTML: !Ref YahooAuctionDebugLogHtml
          ITEMS_PER_PAGE: !Ref YahooAuctionItemsPerPage
          ENABLE_DETAIL_SCRAPE_ON_SEARCH: !Ref EnableDetailScrape
          DETAIL_REQUEST_INTERVAL: !Ref DetailRequestInterval
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars
          DETAIL_SCRAPE_MAX_ITEMS: !Ref DetailScrapeMaxItems
          ENABLE_LOCAL_TITLE_FILTER: "true"
          LOCAL_TITLE_FILTER_STRICT: "false"
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # YahooAuctionLinkCrawler - 增量递归链接采集器
  # ============================================================

  YahooAuctionLinkCrawler:
    Type: AWS::Lambda::Function
    Condition: DeployLinkCrawlerCondition
    DependsOn:
      - YahooAuctionLinkCrawlerLogGroup
      - YahooAuctionLinkCrawlerRole
    Properties:
      FunctionName: !Sub "YahooAuctionLinkCrawler-${Environment}"
      Description: Yahoo 拍卖递归链接采集器 (增量版，智能起始点选择)
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: search_engine_crawler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt YahooAuctionLinkCrawlerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          LINK_CRAWLER_TABLE_NAME: !Ref YahooAuctionLinksTable
          LINK_CRAWLER_MAX_PAGES: !Ref LinkCrawlerMaxPages
          LINK_CRAWLER_MAX_DEPTH: !Ref LinkCrawlerMaxDepth
          LINK_CRAWLER_MAX_LINKS_PER_RUN: !Ref LinkCrawlerMaxLinksPerRun
          LINK_CRAWLER_MAX_ATTEMPTS: !Ref LinkCrawlerMaxAttempts
          LINK_CRAWLER_REQUEST_INTERVAL: !Ref LinkCrawlerRequestInterval
          LINK_CRAWLER_ENABLE_RECURSIVE: !Ref LinkCrawlerEnableRecursive
          LINK_CRAWLER_TIMEOUT: !Ref YahooAuctionRequestTimeout
      Tags:
        - Key: Application
          Value: YahooAuctionLinkCrawler
        - Key: Environment
          Value: !Ref Environment

  # 定时器：Yahoo Auction Link Crawler - 默认关闭
  YahooAuctionLinkCrawlerScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployLinkCrawlerCondition
    Properties:
      Name: !Sub "YahooAuctionLinkCrawler-Schedule-${Environment}"
      Description: 定时触发 Yahoo 拍卖递归链接采集器 (默认关闭)
      ScheduleExpression: !Sub "rate(${LinkCrawlerScheduleMinutes} minutes)"
      State: DISABLED
      Targets:
        - Arn: !GetAtt YahooAuctionLinkCrawler.Arn
          Id: YahooAuctionLinkCrawlerTarget

  YahooAuctionLinkCrawlerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployLinkCrawlerCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref YahooAuctionLinkCrawler
      Principal: events.amazonaws.com
      SourceArn: !GetAtt YahooAuctionLinkCrawlerScheduleRule.Arn

  # ============================================================
  # Yahoo Auction Final Check
  # ============================================================

  YahooAuctionFinalCheckFunction:
    Type: AWS::Lambda::Function
    Condition: DeployScraperCondition
    DependsOn:
      - YahooAuctionFinalCheckLogGroup
      - YahooAuctionFinalCheckRole
    Properties:
      FunctionName: !Sub "YahooAuctionFinalCheckReminder-${Environment}"
      Description: BUY_CANDIDATE 结束前最终复核和 SNS 邮件提醒
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: final_check_reminder.lambda_handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt YahooAuctionFinalCheckRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          BUY_CANDIDATE_TABLE: !Ref YahooAuctionBuyCandidateTable
          ACTIVE_TABLE: !Ref YahooAuctionActiveTable
          SNS_TOPIC_ARN: !Ref YahooAuctionBuyCandidateReminderTopic
          FINAL_CHECK_BATCH_SIZE: !Ref FinalCheckBatchSize
          FINAL_CHECK_BEFORE_MINUTES: !Ref FinalCheckBeforeMinutes
          FEE_RATE: !Ref ExpectedSellingFeeRate
          SHIPPING_COST: !Ref DefaultShippingCost
          REPAIR_RESERVE: !Ref DefaultRepairReserveRate
          RISK_RESERVE: !Ref RiskReserveRate
          REQUEST_TIMEOUT: !Ref YahooAuctionRequestTimeout
      Tags:
        - Key: Application
          Value: YahooAuctionFinalCheckReminder
        - Key: Environment
          Value: !Ref Environment

  # 定时器：Yahoo Auction Final Check - 默认开启
  YahooAuctionFinalCheckScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployScraperCondition
    Properties:
      Name: !Sub "YahooAuctionFinalCheck-Schedule-${Environment}"
      Description: 每分钟复核即将结束的 BUY_CANDIDATE 并发送倒计时提醒 (默认开启)
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt YahooAuctionFinalCheckFunction.Arn
          Id: YahooAuctionFinalCheckTarget

  YahooAuctionFinalCheckInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployScraperCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref YahooAuctionFinalCheckFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt YahooAuctionFinalCheckScheduleRule.Arn

  AuctionAnalyzerFunction:
    Type: AWS::Lambda::Function
    Condition: DeployScraperCondition
    DependsOn:
      - YahooAuctionAnalyzerLogGroup
      - YahooAuctionAnalyzerRole
    Properties:
      FunctionName: !Sub "YahooAuctionAnalyzer-${Environment}"
      Description: Yahoo Auction 商品分析工作流
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: auction_analyzer.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt YahooAuctionAnalyzerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          TABLE_NAME: !Ref ProductCatalogTable
          BUY_CANDIDATE_TABLE: !Ref YahooAuctionBuyCandidateTable
          SNS_TOPIC_ARN: !Ref YahooAuctionBuyCandidateReminderTopic
          FINAL_CHECK_BEFORE_MINUTES: !Ref FinalCheckBeforeMinutes
          ENVIRONMENT: !Ref Environment
          TOKEN_USAGE_TABLE: !Ref AiTokenUsageTable

          AI_MODE: !Ref AiMode
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_URL: !Ref GeminiUrl
          GEMINI_TIMEOUT: !Ref GeminiTimeout
          GEMINI_MAX_TOKENS: !Ref GeminiMaxTokens
          DOUBAO_MODEL: !Ref DoubaoModel
          DOUBAO_URL: !Ref DoubaoUrl
          DOUBAO_TIMEOUT: !Ref DoubaoTimeout
          DOUBAO_MAX_TOKENS: !Ref DoubaoMaxTokens
          OPENAI_MODEL: !Ref OpenaiModel
          OPENAI_URL: !Ref OpenaiUrl
          OPENAI_TIMEOUT: !Ref OpenaiTimeout
          OPENAI_MAX_TOKENS: !Ref OpenaiMaxTokens
          MIN_COMPARABLE_COUNT: !Ref MinComparableCount
          BUY_MARGIN_THRESHOLD: !Ref BuyMarginThreshold
          REVIEW_MARGIN_THRESHOLD: !Ref ReviewMarginThreshold

          MAX_TOKENS: !Ref MaxTotalTokens
          SIMPLE_MAX_TOKENS: "4000"
          DETAIL_MAX_TOKENS: "12000"
          LOG_AI_REQUEST_JSON: !Ref LogAiRequestJson
          LOG_AI_RESPONSE_JSON: !Ref LogAiResponseJson
          LAMBDA_TIMEOUT: "900"
          TIMEOUT_BUFFER: !Ref LambdaTimeoutBuffer
          
          MODEL_BATCH: !Ref ModelParseBatchSize
          SIMPLE_BATCH: !Ref ModelParseBatchSize
          DETAIL_BATCH: "10"
          REQ_INTERVAL: !Ref RequestInterval
          
          FEE_RATE: !Ref ExpectedSellingFeeRate
          SHIPPING_COST: !Ref DefaultShippingCost
          REPAIR_RESERVE: !Ref DefaultRepairReserveRate
          RISK_RESERVE: !Ref RiskReserveRate
          MAX_PRICE_DEV: !Ref MaxPriceDeviation
          ACTIVE_MAX_RATIO: !Ref ActiveMaxRatio
          MIN_ROI: !Ref MinRoi
          
          DETAIL_DESC_MAX: !Ref DetailDescMaxChars
          FALLBACK_MATCH: "true"
          FAMILY_MATCH: "true"
          
          HIGH_CONFIDENCE_COUNT: !Ref HighConfidenceComparableCount
          MEDIUM_CONFIDENCE_COUNT: !Ref MediumConfidenceComparableCount

          ENABLE_DETAIL_SCRAPE_ON_SEARCH: !Ref EnableDetailScrape
          DETAIL_REQUEST_INTERVAL: !Ref DetailRequestInterval
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars

          MAX_PAGES: !Ref YahooAuctionMaxPages
          REQUEST_TIMEOUT: !Ref YahooAuctionRequestTimeout
          DEBUG_LOG_HTML: !Ref YahooAuctionDebugLogHtml
          ITEMS_PER_PAGE: !Ref YahooAuctionItemsPerPage
          ENABLE_LOCAL_TITLE_FILTER: "true"
          LOCAL_TITLE_FILTER_STRICT: "false"

      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment

  # 定时器：Yahoo Auction Analyzer 倒计时扫描 - 每 5 分钟，默认关闭
  YahooAuctionCountdownScanScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployScraperCondition
    Properties:
      Name: !Sub "YahooAuctionAnalyzer-Countdown-Schedule-${Environment}"
      Description: 每 5 分钟触发 Yahoo Auction Analyzer 倒计时扫描（默认关闭）
      ScheduleExpression: rate(5 minutes)
      State: DISABLED
      Targets:
        - Arn: !GetAtt AuctionAnalyzerFunction.Arn
          Id: YahooAuctionCountdownScanTarget
          Input: !Ref CountdownScanEventJson

  YahooAuctionCountdownScanInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployScraperCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuctionAnalyzerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt YahooAuctionCountdownScanScheduleRule.Arn

  CatalogScannerFunction:
    Type: AWS::Lambda::Function
    Condition: DeployCatalogScannerCondition
    DependsOn:
      - CatalogScannerLogGroup
      - CatalogScannerRole
    Properties:
      FunctionName: !Sub "CatalogScanner-${Environment}"
      Description: 定期扫描产品目录，触发分析
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: catalog_scanner.lambda_handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt CatalogScannerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductCatalogTable
          ANALYZER_FUNCTION_NAME: !Ref AuctionAnalyzerFunction
          MAX_MODELS_PER_RUN: !Ref CatalogScannerMaxModels
          SCAN_INTERVAL_DAYS: "3"
          MAX_ACTIVE_COUNT: !Ref MaxActiveItems
          MAX_CLOSED_COUNT: !Ref MaxClosedPerModel
          DISPATCH_INTERVAL_SECONDS: "0.3"
          DISPATCH_JITTER_SECONDS: "0.2"
          STARTUP_JITTER_SECONDS: "1"
          BATCH_SIZE: "5"
          BATCH_INTERVAL_SECONDS: "1"
          TODAY_TAG_KEY: "last_scanned_date"
          DATA_SOURCE: "AI_DISCOVERY"
      Tags:
        - Key: Application
          Value: CatalogScanner
        - Key: Environment
          Value: !Ref Environment

  # 定时器：Catalog Scanner - 默认关闭
  CatalogScannerScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployCatalogScannerCondition
    Properties:
      Name: !Sub "CatalogScanner-Schedule-${Environment}"
      Description: 定期触发目录扫描器 (默认关闭)
      ScheduleExpression: rate(3 minutes)
      State: DISABLED
      Targets:
        - Arn: !GetAtt CatalogScannerFunction.Arn
          Id: "CatalogScannerTarget"
          Input: !Sub '{"source":"aws.events","max_models":${CatalogScannerMaxModels}}'

  CatalogScannerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployCatalogScannerCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CatalogScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CatalogScannerScheduleRule.Arn

Outputs:
  YahooAuctionLinksTableName:
    Condition: DeployLinkCrawlerCondition
    Description: Yahoo 拍卖链接采集表
    Value: !Ref YahooAuctionLinksTable

  YahooAuctionLinkCrawlerFunctionName:
    Condition: DeployLinkCrawlerCondition
    Description: Yahoo 拍卖增量递归链接采集 Lambda
    Value: !Ref YahooAuctionLinkCrawler

  AiTokenUsageTableName:
    Value: !Ref AiTokenUsageTable

  ProductCatalogTableName:
    Condition: DeployMainAppCondition
    Value: !Ref ProductCatalogTable

  YahooAuctionClosedTableName:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionClosedTable

  YahooAuctionActiveTableName:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionActiveTable

  YahooAuctionBuyCandidateTableName:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionBuyCandidateTable

  YahooAuctionBuyCandidateReminderTopicArn:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionBuyCandidateReminderTopic

  AuctionAnalyzerFunctionName:
    Condition: DeployScraperCondition
    Value: !Ref AuctionAnalyzerFunction

  CatalogScannerFunctionName:
    Condition: DeployCatalogScannerCondition
    Value: !Ref CatalogScannerFunction
