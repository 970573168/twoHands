AWSTemplateFormatVersion: "2010-09-09"

Description: >
  电子产品目录采集器 + AI API Secret + Yahoo Auction 抓取器 + 分析工作流 + 目录定期扫描器
  支持多 AI 模式切换（Gemini / 豆包 / OpenAI）
  Secret 已存在时不会重复创建
  API Key 统一通过 Secrets Manager 管理，不传入 Lambda 环境变量

Parameters:
  # ============ 通用参数 ============
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: 环境名称

  # ============ S3 代码部署参数 ============
  LambdaCodeS3Bucket:
    Type: String
    Description: 已存在的 S3 Bucket 名称，用于存储 Lambda 代码

  LambdaCodeS3Key:
    Type: String
    Default: "productcatalog/lambda.zip"
    Description: S3 中 Lambda 代码的对象键

  # ============ AI 模式选择 ============
  AiMode:
    Type: String
    Default: "doubao"
    AllowedValues:
      - gemini
      - doubao
      - openai
    Description: AI 模式选择（gemini / doubao / openai）

  # ============ Gemini 配置 ============
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Gemini API Key（用于创建 Secret，留空则不创建）

  GeminiModel:
    Type: String
    Default: "gemini-2.0-flash"
    Description: Gemini 模型名称

  GeminiUrl:
    Type: String
    Default: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
    Description: Gemini API URL

  GeminiTimeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 300

  GeminiMaxTokens:
    Type: Number
    Default: 12000
    MinValue: 100
    MaxValue: 1000000

  # ============ 豆包配置 ============
  DoubaoApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 豆包 API Key（用于创建 Secret，留空则不创建）

  DoubaoModel:
    Type: String
    Default: "qwen-plus-character"
    Description: 豆包模型名称

  DoubaoUrl:
    Type: String
    Default: "https://ws-8lxmxlbemcgcus5u.ap-northeast-1.maas.aliyuncs.com/compatible-mode/v1/chat/completions"
    Description: 豆包 API URL

  DoubaoTimeout:
    Type: Number
    Default: 300
    MinValue: 10
    MaxValue: 300

  DoubaoMaxTokens:
    Type: Number
    Default: 12000
    MinValue: 100
    MaxValue: 1000000

  # ============ OpenAI 配置 ============
  OpenaiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: OpenAI API Key（用于创建 Secret，留空则不创建）

  OpenaiModel:
    Type: String
    Default: "gpt-4o-mini"
    Description: OpenAI 模型名称

  OpenaiUrl:
    Type: String
    Default: "https://api.openai.com/v1/chat/completions"
    Description: OpenAI API URL

  OpenaiTimeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 300

  OpenaiMaxTokens:
    Type: Number
    Default: 12000
    MinValue: 100
    MaxValue: 1000000

  # ============ 故障切换配置 ============
  AiFailoverCooldown:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600
    Description: AI 模式故障切换冷却时间（秒）

  # ============ 主应用参数 ============
  DeployMainApp:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  MaxCategoriesPerRun:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100

  MaxBrandsPerCategory:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100

  MaxModelsPerBrand:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 100

  MaxTotalTokens:
    Type: Number
    Default: 250000
    MinValue: 10000
    MaxValue: 1000000

  LambdaTimeoutBuffer:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 300

  ApiCallDelay:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10

  CategoryLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20

  BrandLimit:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10

  LogRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 3653

  # ============ Yahoo Auction 抓取器参数 ============
  DeployScraper:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  YahooAuctionMaxPages:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10

  YahooAuctionRequestTimeout:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 120

  YahooAuctionDebugLogHtml:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  YahooAuctionItemsPerPage:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 100

  # ============ Yahoo Auction Analyzer 参数 ============
  ModelParseBatchSize:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 1000

  ClosedParseBatchSize:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 1000

  MaxClosedPerModel:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 200

  DefaultSearchCount:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000

  MaxActiveItems:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000

  AiRequestTimeout:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 500

  AiMaxRetries:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 5

  RequestInterval:
    Type: Number
    Default: 1.0
    MinValue: 0.1
    MaxValue: 5.0

  ExpectedSellingFeeRate:
    Type: Number
    Default: 0.10
    MinValue: 0
    MaxValue: 1

  DefaultShippingCost:
    Type: Number
    Default: 1500
    MinValue: 0
    MaxValue: 10000

  DefaultRepairReserveRate:
    Type: Number
    Default: 0.05
    MinValue: 0
    MaxValue: 1

  MinComparableCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10

  MaxPriceDeviation:
    Type: Number
    Default: 1.5
    MinValue: 1
    MaxValue: 5

  RiskReserveRate:
    Type: Number
    Default: 0.03
    MinValue: 0
    MaxValue: 1

  ActivePriceMinRatio:
    Type: Number
    Default: 0.5
    MinValue: 0.1
    MaxValue: 1.0

  BuyMarginThreshold:
    Type: Number
    Default: 0.20
    MinValue: 0.05
    MaxValue: 0.50

  ReviewMarginThreshold:
    Type: Number
    Default: 0.10
    MinValue: 0.05
    MaxValue: 0.50

  HighConfidenceComparableCount:
    Type: Number
    Default: 10
    MinValue: 5
    MaxValue: 50

  MediumConfidenceComparableCount:
    Type: Number
    Default: 5
    MinValue: 3
    MaxValue: 20

  MinRoi:
    Type: Number
    Default: 0.15
    MinValue: 0.05
    MaxValue: 0.50

  DetailDescMaxChars:
    Type: Number
    Default: 3000
    MinValue: 500
    MaxValue: 10000

  LogAiRequestJson:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: 是否在 Analyzer 日志中打印发送给 AI 的完整 JSON（不包含 API Key）

  LogAiResponseJson:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: 是否在 Analyzer 日志中打印 AI 返回的完整 JSON

  # ============ Yahoo Auction 详情抓取参数 ============
  EnableDetailScrape:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  DetailRequestInterval:
    Type: Number
    Default: 0.3
    MinValue: 0.1
    MaxValue: 5.0

  DetailScrapeMaxItems:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 100

  # ============ Catalog Scanner 参数 ============
  DeployCatalogScanner:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  CatalogScannerEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CatalogScannerIntervalMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1440

  CatalogScannerMaxModels:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100

Conditions:
  CreateGeminiSecret: !Not [!Equals [!Ref GeminiApiKey, ""]]
  CreateDoubaoSecret: !Not [!Equals [!Ref DoubaoApiKey, ""]]
  CreateOpenaiSecret: !Not [!Equals [!Ref OpenaiApiKey, ""]]
  DeployMainAppCondition: !Equals [!Ref DeployMainApp, "true"]
  DeployScraperCondition: !Equals [!Ref DeployScraper, "true"]
  CatalogScannerEnabledCondition: !Equals [!Ref CatalogScannerEnabled, "true"]
  DeployCatalogScannerCondition: !And
    - !Equals [!Ref DeployCatalogScanner, "true"]
    - !Condition DeployMainAppCondition
    - !Condition DeployScraperCondition

Resources:
  # ============================================
  # AI API Secrets (由 CloudFormation 创建)
  # ============================================
  
  GeminiApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateGeminiSecret
    Properties:
      Name: !Sub "gemini-api-key-${Environment}"
      Description: Gemini API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"GEMINI_API_KEY":"${GeminiApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Gemini

  DoubaoApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDoubaoSecret
    Properties:
      Name: !Sub "doubao-api-key-${Environment}"
      Description: Doubao API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"DOUBAO_API_KEY":"${DoubaoApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: Doubao

  OpenaiApiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateOpenaiSecret
    Properties:
      Name: !Sub "openai-api-key-${Environment}"
      Description: OpenAI API Key for Yahoo Auction Analyzer
      SecretString: !Sub '{"OPENAI_API_KEY":"${OpenaiApiKey}"}'
      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment
        - Key: Type
          Value: OpenAI

  # ============================================
  # DynamoDB Tables
  # ============================================

  ProductCatalogTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployMainAppCondition
    Properties:
      TableName: !Sub "ProductCatalog-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: modified_index_pk
          AttributeType: S
        - AttributeName: modified_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modified_index_pk
              KeyType: HASH
            - AttributeName: modified_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: ProductCatalog
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionClosedTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployScraperCondition
    Properties:
      TableName: !Sub "YahooAuctionItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID
          AttributeType: S
        - AttributeName: modifiedIndexPk
          AttributeType: S
        - AttributeName: modifiedAt
          AttributeType: S
      KeySchema:
        - AttributeName: itemID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modifiedIndexPk
              KeyType: HASH
            - AttributeName: modifiedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionActiveTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployScraperCondition
    Properties:
      TableName: !Sub "YahooAuctionActiveItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID
          AttributeType: S
        - AttributeName: modifiedIndexPk
          AttributeType: S
        - AttributeName: modifiedAt
          AttributeType: S
      KeySchema:
        - AttributeName: itemID
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ModifiedAtIndex
          KeySchema:
            - AttributeName: modifiedIndexPk
              KeyType: HASH
            - AttributeName: modifiedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # Log Groups
  # ============================================

  ProductCatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployMainAppCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/ProductCatalog-Discovery-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployScraperCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionScraper-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  YahooAuctionAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployScraperCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionAnalyzer-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  CatalogScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployCatalogScannerCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/CatalogScanner-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # ============================================
  # IAM Roles
  # ============================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployMainAppCondition
    Properties:
      RoleName: !Sub "ProductCatalog-LambdaRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProductCatalogDiscoveryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBCatalogAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ProductCatalogTable.Arn
                  - !Sub "${ProductCatalogTable.Arn}/index/*"
              - Sid: ReadApiSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:doubao-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai-api-key-${Environment}-*"
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ProductCatalogLogGroup.Arn}:*"

  YahooAuctionScraperRole:
    Type: AWS::IAM::Role
    Condition: DeployScraperCondition
    Properties:
      RoleName: !Sub "YahooAuctionScraper-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionScraperPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt YahooAuctionClosedTable.Arn
                  - !GetAtt YahooAuctionActiveTable.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${YahooAuctionScraperLogGroup.Arn}:*"
                  - !Sub "${YahooAuctionAnalyzerLogGroup.Arn}:*"

  YahooAuctionAnalyzerRole:
    Type: AWS::IAM::Role
    Condition: DeployScraperCondition
    Properties:
      RoleName: !Sub "YahooAuctionAnalyzer-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: YahooAuctionAnalyzerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBFullAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt YahooAuctionClosedTable.Arn
                  - !GetAtt YahooAuctionActiveTable.Arn
              - Sid: ReadAllApiSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:doubao-api-key-${Environment}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai-api-key-${Environment}-*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${YahooAuctionScraperLogGroup.Arn}:*"
                  - !Sub "${YahooAuctionAnalyzerLogGroup.Arn}:*"

  CatalogScannerRole:
    Type: AWS::IAM::Role
    Condition: DeployCatalogScannerCondition
    Properties:
      RoleName: !Sub "CatalogScanner-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CatalogScannerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ProductCatalogTable.Arn
                  - !Sub "${ProductCatalogTable.Arn}/index/*"
              - Sid: InvokeAnalyzerLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuctionAnalyzerFunction.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CatalogScannerLogGroup.Arn}:*"

  # ============================================
  # Lambda Functions
  # ============================================

  ProductCatalogDiscovery:
    Type: AWS::Lambda::Function
    Condition: DeployMainAppCondition
    DependsOn:
      - ProductCatalogLogGroup
      - LambdaExecutionRole
    Properties:
      FunctionName: !Sub "ProductCatalog-Discovery-${Environment}"
      Description: 通过 AI 发现电子产品品类、品牌和型号
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductCatalogTable
          ENVIRONMENT: !Ref Environment
          AI_MODE: !Ref AiMode
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_URL: !Ref GeminiUrl
          GEMINI_TIMEOUT: !Ref GeminiTimeout
          GEMINI_MAX_TOKENS: !Ref GeminiMaxTokens
          DOUBAO_MODEL: !Ref DoubaoModel
          DOUBAO_URL: !Ref DoubaoUrl
          DOUBAO_TIMEOUT: !Ref DoubaoTimeout
          DOUBAO_MAX_TOKENS: !Ref DoubaoMaxTokens
          OPENAI_MODEL: !Ref OpenaiModel
          OPENAI_URL: !Ref OpenaiUrl
          OPENAI_TIMEOUT: !Ref OpenaiTimeout
          OPENAI_MAX_TOKENS: !Ref OpenaiMaxTokens
          AI_FAILOVER_COOLDOWN: !Ref AiFailoverCooldown
          MAX_CATEGORIES: !Ref MaxCategoriesPerRun
          MAX_BRANDS: !Ref MaxBrandsPerCategory
          MAX_MODELS: !Ref MaxModelsPerBrand
          MAX_TOTAL_TOKENS: !Ref MaxTotalTokens
          LAMBDA_TIMEOUT_SECONDS: "900"
          LAMBDA_TIMEOUT_BUFFER: !Ref LambdaTimeoutBuffer
          CATEGORY_LIMIT: !Ref CategoryLimit
          BRAND_LIMIT: !Ref BrandLimit
          API_CALL_DELAY: !Ref ApiCallDelay
      Tags:
        - Key: Application
          Value: ProductCatalog
        - Key: Environment
          Value: !Ref Environment

  YahooAuctionScraper:
    Type: AWS::Lambda::Function
    Condition: DeployScraperCondition
    DependsOn:
      - YahooAuctionScraperLogGroup
      - YahooAuctionScraperRole
    Properties:
      FunctionName: !Sub "YahooAuctionScraper-${Environment}"
      Description: Yahoo Auction 搜索抓取器
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: yahoo_auction_scraper.lambda_handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt YahooAuctionScraperRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          MAX_PAGES: !Ref YahooAuctionMaxPages
          REQUEST_TIMEOUT: !Ref YahooAuctionRequestTimeout
          DEBUG_LOG_HTML: !Ref YahooAuctionDebugLogHtml
          ITEMS_PER_PAGE: !Ref YahooAuctionItemsPerPage
          ENABLE_DETAIL_SCRAPE_ON_SEARCH: !Ref EnableDetailScrape
          DETAIL_REQUEST_INTERVAL: !Ref DetailRequestInterval
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars
          DETAIL_SCRAPE_MAX_ITEMS: !Ref DetailScrapeMaxItems
      Tags:
        - Key: Application
          Value: YahooAuctionScraper
        - Key: Environment
          Value: !Ref Environment

  AuctionAnalyzerFunction:
    Type: AWS::Lambda::Function
    Condition: DeployScraperCondition
    DependsOn:
      - YahooAuctionAnalyzerLogGroup
      - YahooAuctionAnalyzerRole
    Properties:
      FunctionName: !Sub "YahooAuctionAnalyzer-${Environment}"
      Description: Yahoo Auction 商品分析工作流
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: auction_analyzer.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt YahooAuctionAnalyzerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          ENVIRONMENT: !Ref Environment

          AI_MODE: !Ref AiMode
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_URL: !Ref GeminiUrl
          GEMINI_TIMEOUT: !Ref GeminiTimeout
          GEMINI_MAX_TOKENS: !Ref GeminiMaxTokens
          DOUBAO_MODEL: !Ref DoubaoModel
          DOUBAO_URL: !Ref DoubaoUrl
          DOUBAO_TIMEOUT: !Ref DoubaoTimeout
          DOUBAO_MAX_TOKENS: !Ref DoubaoMaxTokens
          OPENAI_MODEL: !Ref OpenaiModel
          OPENAI_URL: !Ref OpenaiUrl
          OPENAI_TIMEOUT: !Ref OpenaiTimeout
          OPENAI_MAX_TOKENS: !Ref OpenaiMaxTokens
          MIN_COMPARABLE_COUNT: !Ref MinComparableCount
          BUY_MARGIN_THRESHOLD: !Ref BuyMarginThreshold
          REVIEW_MARGIN_THRESHOLD: !Ref ReviewMarginThreshold

          MAX_TOKENS: !Ref MaxTotalTokens
          SIMPLE_MAX_TOKENS: "4000"
          DETAIL_MAX_TOKENS: "12000"
          LOG_AI_REQUEST_JSON: !Ref LogAiRequestJson
          LOG_AI_RESPONSE_JSON: !Ref LogAiResponseJson
          LAMBDA_TIMEOUT: "900"
          TIMEOUT_BUFFER: !Ref LambdaTimeoutBuffer
          
          MODEL_BATCH: !Ref ModelParseBatchSize
          SIMPLE_BATCH: !Ref ModelParseBatchSize
          DETAIL_BATCH: "10"
          REQ_INTERVAL: !Ref RequestInterval
          
          FEE_RATE: !Ref ExpectedSellingFeeRate
          SHIPPING_COST: !Ref DefaultShippingCost
          REPAIR_RESERVE: !Ref DefaultRepairReserveRate
          RISK_RESERVE: !Ref RiskReserveRate
          MAX_PRICE_DEV: !Ref MaxPriceDeviation
          PRICE_MIN_RATIO: !Ref ActivePriceMinRatio
          MIN_ROI: !Ref MinRoi
          
          DETAIL_DESC_MAX: !Ref DetailDescMaxChars
          FALLBACK_MATCH: "true"
          FAMILY_MATCH: "true"
          
          HIGH_CONFIDENCE_COUNT: !Ref HighConfidenceComparableCount
          MEDIUM_CONFIDENCE_COUNT: !Ref MediumConfidenceComparableCount

          ENABLE_DETAIL_SCRAPE_ON_SEARCH: !Ref EnableDetailScrape
          DETAIL_REQUEST_INTERVAL: !Ref DetailRequestInterval
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars

          MAX_PAGES: !Ref YahooAuctionMaxPages
          REQUEST_TIMEOUT: !Ref YahooAuctionRequestTimeout
          DEBUG_LOG_HTML: !Ref YahooAuctionDebugLogHtml
          ITEMS_PER_PAGE: !Ref YahooAuctionItemsPerPage

      Tags:
        - Key: Application
          Value: YahooAuctionAnalyzer
        - Key: Environment
          Value: !Ref Environment

  CatalogScannerFunction:
    Type: AWS::Lambda::Function
    Condition: DeployCatalogScannerCondition
    DependsOn:
      - CatalogScannerLogGroup
      - CatalogScannerRole
    Properties:
      FunctionName: !Sub "CatalogScanner-${Environment}"
      Description: 定期扫描产品目录，触发分析
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: catalog_scanner.lambda_handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt CatalogScannerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductCatalogTable
          ANALYZER_FUNCTION_NAME: !Ref AuctionAnalyzerFunction
          SCAN_INTERVAL_MINUTES: !Ref CatalogScannerIntervalMinutes
          MAX_MODELS_PER_RUN: !Ref CatalogScannerMaxModels
          MAX_ACTIVE_COUNT: !Ref MaxActiveItems
          MAX_CLOSED_COUNT: !Ref MaxClosedPerModel
          ENABLE_SCHEDULED_SCAN: !Ref CatalogScannerEnabled
          DISPATCH_INTERVAL_SECONDS: "0.3"
          DISPATCH_JITTER_SECONDS: "0.2"
          STARTUP_JITTER_SECONDS: "1"
          BATCH_SIZE: "5"
          BATCH_INTERVAL_SECONDS: "1"
          TODAY_TAG_KEY: "last_scanned_date"
          DATA_SOURCE: "AI_DISCOVERY"
      Tags:
        - Key: Application
          Value: CatalogScanner
        - Key: Environment
          Value: !Ref Environment

  CatalogScannerScheduleRule:
    Type: AWS::Events::Rule
    Condition: DeployCatalogScannerCondition
    Properties:
      Name: !Sub "CatalogScanner-Schedule-${Environment}"
      Description: 定期触发目录扫描器
      ScheduleExpression: !Sub "rate(${CatalogScannerIntervalMinutes} minutes)"
      State: !If
        - CatalogScannerEnabledCondition
        - ENABLED
        - DISABLED
      Targets:
        - Arn: !GetAtt CatalogScannerFunction.Arn
          Id: "CatalogScannerTarget"
          Input: !Sub '{"source":"aws.events","max_models":${CatalogScannerMaxModels}}'

  CatalogScannerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployCatalogScannerCondition
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CatalogScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CatalogScannerScheduleRule.Arn

Outputs:
  ProductCatalogTableName:
    Condition: DeployMainAppCondition
    Value: !Ref ProductCatalogTable

  YahooAuctionClosedTableName:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionClosedTable

  YahooAuctionActiveTableName:
    Condition: DeployScraperCondition
    Value: !Ref YahooAuctionActiveTable

  AuctionAnalyzerFunctionName:
    Condition: DeployScraperCondition
    Value: !Ref AuctionAnalyzerFunction

  CatalogScannerFunctionName:
    Condition: DeployCatalogScannerCondition
    Value: !Ref CatalogScannerFunction
