AWSTemplateFormatVersion: "2010-09-09"
Description: "Yahoo Auction 爬虫 + AI分析 + 目录扫描 完整栈"

Parameters:
  Environment:
    Type: String; Default: dev; AllowedValues: [dev, test, prod]

  LambdaCodeS3Bucket:
    Type: String; Description: S3 Bucket for Lambda code
  LambdaCodeS3Key:
    Type: String; Default: "productcatalog/lambda.zip"

  # ============ AI 模式 ============
  AiMode:
    Type: String; Default: doubao; AllowedValues: [gemini, doubao, openai]

  # ============ AI Keys ============
  GeminiApiKey:    Type: String; NoEcho: true; Default: ""
  DoubaoApiKey:    Type: String; NoEcho: true; Default: ""
  OpenaiApiKey:    Type: String; NoEcho: true; Default: ""
  GeminiMaxTokens: Type: Number; Default: 4000; MinValue: 100; MaxValue: 8192
  DoubaoMaxTokens: Type: Number; Default: 6000; MinValue: 100; MaxValue: 8192
  OpenaiMaxTokens: Type: Number; Default: 4000; MinValue: 100; MaxValue: 16384

  # ============ 功能开关 ============
  DeploySecret:  Type: String; Default: "false"; AllowedValues: ["true","false"]
  DeployScraper: Type: String; Default: "true";  AllowedValues: ["true","false"]
  DeployScanner: Type: String; Default: "true";  AllowedValues: ["true","false"]
  ScannerEnabled: Type: String; Default: "false"; AllowedValues: ["true","false"]

  # ============ 核心参数 ============
  LogRetentionDays:  Type: Number; Default: 14; MinValue: 1; MaxValue: 3653
  MaxTotalTokens:    Type: Number; Default: 50000; MinValue: 10000; MaxValue: 1000000
  LambdaTimeoutBuffer: Type: Number; Default: 30; MinValue: 10; MaxValue: 300

  # ============ 爬虫参数 ============
  MaxPages:        Type: Number; Default: 1;  MinValue: 1; MaxValue: 10
  ItemsPerPage:    Type: Number; Default: 100; MinValue: 10; MaxValue: 100
  RequestTimeout:  Type: Number; Default: 30; MinValue: 5; MaxValue: 120

  # ============ 分析器参数 ============
  DefaultSearchCount:  Type: Number; Default: 100; MinValue: 1; MaxValue: 1000
  MaxActiveItems:      Type: Number; Default: 100; MinValue: 1; MaxValue: 1000
  ModelParseBatchSize: Type: Number; Default: 100; MinValue: 1; MaxValue: 1000
  ClosedParseBatchSize: Type: Number; Default: 100; MinValue: 1; MaxValue: 1000
  ExpectedSellingFeeRate:   Type: Number; Default: 0.10; MinValue: 0; MaxValue: 1
  DefaultShippingCost:      Type: Number; Default: 1500; MinValue: 0; MaxValue: 10000
  DefaultRepairReserveRate: Type: Number; Default: 0.05; MinValue: 0; MaxValue: 1
  MinComparableCount:       Type: Number; Default: 3; MinValue: 1; MaxValue: 10
  MaxPriceDeviation:        Type: Number; Default: 1.5; MinValue: 1; MaxValue: 5
  RiskReserveRate:          Type: Number; Default: 0.03; MinValue: 0; MaxValue: 1
  RequestInterval:          Type: Number; Default: 1.0; MinValue: 0.1; MaxValue: 5.0

  # ============ 详情抓取参数 ============
  EnableDetailScrape:  Type: String; Default: "true"; AllowedValues: ["true","false"]
  DetailRequestInterval: Type: Number; Default: 1.0; MinValue: 0.1; MaxValue: 5.0
  DetailDescMaxChars:  Type: Number; Default: 3000; MinValue: 500; MaxValue: 10000

  # ============ Scanner 参数 ============
  ScannerIntervalMinutes: Type: Number; Default: 5; MinValue: 1; MaxValue: 1440
  ScannerMaxModels:       Type: Number; Default: 10; MinValue: 1; MaxValue: 100

Conditions:
  DeploySecretCond: !Equals [!Ref DeploySecret, "true"]
  DeployScraperCond: !Equals [!Ref DeployScraper, "true"]
  DeployScannerCond: !And [!Equals [!Ref DeployScanner, "true"], !Condition DeployScraperCond]
  ScannerEnabledCond: !Equals [!Ref ScannerEnabled, "true"]

Resources:
  # ============================================
  # Secrets
  # ============================================
  GeminiSecret:
    Condition: !And [!Condition DeploySecretCond, !Not [!Equals [!Ref GeminiApiKey, ""]]]
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "gemini-api-key-${Environment}"
      SecretString: !Sub '{"GEMINI_API_KEY":"${GeminiApiKey}"}'

  DoubaoSecret:
    Condition: !And [!Condition DeploySecretCond, !Not [!Equals [!Ref DoubaoApiKey, ""]]]
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "doubao-api-key-${Environment}"
      SecretString: !Sub '{"DOUBAO_API_KEY":"${DoubaoApiKey}"}'

  OpenaiSecret:
    Condition: !And [!Condition DeploySecretCond, !Not [!Equals [!Ref OpenaiApiKey, ""]]]
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "openai-api-key-${Environment}"
      SecretString: !Sub '{"OPENAI_API_KEY":"${OpenaiApiKey}"}'

  # ============================================
  # DynamoDB Tables
  # ============================================
  ClosedTable:
    Condition: DeployScraperCond
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "YahooAuctionItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID; AttributeType: S
      KeySchema:
        - AttributeName: itemID; KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl; Enabled: true
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      Tags:
        - Key: Type; Value: Closed

  ActiveTable:
    Condition: DeployScraperCond
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "YahooAuctionActiveItems-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemID; AttributeType: S
      KeySchema:
        - AttributeName: itemID; KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl; Enabled: true
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      Tags:
        - Key: Type; Value: Active

  # ============================================
  # Log Groups
  # ============================================
  ScraperLogGroup:
    Condition: DeployScraperCond
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionScraper-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  AnalyzerLogGroup:
    Condition: DeployScraperCond
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/YahooAuctionAnalyzer-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  ScannerLogGroup:
    Condition: DeployScannerCond
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/CatalogScanner-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # ============================================
  # IAM Roles
  # ============================================
  ScraperRole:
    Condition: DeployScraperCond
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "YahooAuctionScraper-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow; Principal: {Service: lambda.amazonaws.com}; Action: sts:AssumeRole
      Policies:
        - PolicyName: ScraperPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt ClosedTable.Arn, !GetAtt ActiveTable.Arn]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: [!Sub "${ScraperLogGroup.Arn}:*", !Sub "${AnalyzerLogGroup.Arn}:*"]

  AnalyzerRole:
    Condition: DeployScraperCond
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "YahooAuctionAnalyzer-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow; Principal: {Service: lambda.amazonaws.com}; Action: sts:AssumeRole
      Policies:
        - PolicyName: AnalyzerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt ClosedTable.Arn, !GetAtt ActiveTable.Arn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*-api-key-${Environment}-*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: [!Sub "${ScraperLogGroup.Arn}:*", !Sub "${AnalyzerLogGroup.Arn}:*"]

  ScannerRole:
    Condition: DeployScannerCond
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CatalogScanner-Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow; Principal: {Service: lambda.amazonaws.com}; Action: sts:AssumeRole
      Policies:
        - PolicyName: ScannerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt ActiveTable.Arn  # Scanner reads from ProductCatalog which is Active table
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AnalyzerFunction.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ScannerLogGroup.Arn}:*"

  # ============================================
  # Lambda Functions
  # ============================================
  ScraperFunction:
    Condition: DeployScraperCond
    Type: AWS::Lambda::Function
    DependsOn: [ScraperLogGroup, ScraperRole]
    Properties:
      FunctionName: !Sub "YahooAuctionScraper-${Environment}"
      Runtime: python3.12; Architectures: [arm64]
      Handler: yahoo_auction_scraper.lambda_handler
      Timeout: 300; MemorySize: 512
      Role: !GetAtt ScraperRole.Arn
      Code: {S3Bucket: !Ref LambdaCodeS3Bucket, S3Key: !Ref LambdaCodeS3Key}
      Environment:
        Variables:
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          MAX_PAGES: !Ref MaxPages
          ITEMS_PER_PAGE: !Ref ItemsPerPage
          REQUEST_TIMEOUT: !Ref RequestTimeout
          ENABLE_DETAIL_SCRAPE_ON_SEARCH: !Ref EnableDetailScrape
          DETAIL_REQUEST_INTERVAL: !Ref DetailRequestInterval
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars

  AnalyzerFunction:
    Condition: DeployScraperCond
    Type: AWS::Lambda::Function
    DependsOn: [AnalyzerLogGroup, AnalyzerRole]
    Properties:
      FunctionName: !Sub "YahooAuctionAnalyzer-${Environment}"
      Runtime: python3.12; Architectures: [arm64]
      Handler: auction_analyzer.lambda_handler
      Timeout: 900; MemorySize: 1024
      Role: !GetAtt AnalyzerRole.Arn
      Code: {S3Bucket: !Ref LambdaCodeS3Bucket, S3Key: !Ref LambdaCodeS3Key}
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          TABLE_NAME_ACTIVE: !Sub "YahooAuctionActiveItems-${Environment}"
          TABLE_NAME_CLOSED: !Sub "YahooAuctionItems-${Environment}"
          AI_MODE: !Ref AiMode
          GEMINI_API_KEY: !Ref GeminiApiKey
          DOUBAO_API_KEY: !Ref DoubaoApiKey
          OPENAI_API_KEY: !Ref OpenaiApiKey
          GEMINI_MAX_TOKENS: !Ref GeminiMaxTokens
          DOUBAO_MAX_TOKENS: !Ref DoubaoMaxTokens
          OPENAI_MAX_TOKENS: !Ref OpenaiMaxTokens
          DEFAULT_SEARCH_COUNT: !Ref DefaultSearchCount
          MAX_ACTIVE_ITEMS: !Ref MaxActiveItems
          MODEL_PARSE_BATCH_SIZE: !Ref ModelParseBatchSize
          CLOSED_PARSE_BATCH_SIZE: !Ref ClosedParseBatchSize
          MAX_TOTAL_TOKENS: !Ref MaxTotalTokens
          LAMBDA_TIMEOUT_BUFFER: !Ref LambdaTimeoutBuffer
          REQUEST_INTERVAL: !Ref RequestInterval
          EXPECTED_SELLING_FEE_RATE: !Ref ExpectedSellingFeeRate
          DEFAULT_SHIPPING_COST: !Ref DefaultShippingCost
          DEFAULT_REPAIR_RESERVE_RATE: !Ref DefaultRepairReserveRate
          MIN_COMPARABLE_COUNT: !Ref MinComparableCount
          MAX_PRICE_DEVIATION: !Ref MaxPriceDeviation
          RISK_RESERVE_RATE: !Ref RiskReserveRate
          DETAIL_DESCRIPTION_MAX_CHARS: !Ref DetailDescMaxChars
          ENABLE_FALLBACK_MATCH: "true"
          ENABLE_FAMILY_MATCH: "true"
          ACTIVE_PRICE_MIN_RATIO: "0.5"
          POTENTIAL_OPPORTUNITY_MIN_ROI: "0.15"

  ScannerFunction:
    Condition: DeployScannerCond
    Type: AWS::Lambda::Function
    DependsOn: [ScannerLogGroup, ScannerRole]
    Properties:
      FunctionName: !Sub "CatalogScanner-${Environment}"
      Runtime: python3.12; Architectures: [arm64]
      Handler: catalog_scanner.lambda_handler
      Timeout: 900; MemorySize: 256
      Role: !GetAtt ScannerRole.Arn
      Code: {S3Bucket: !Ref LambdaCodeS3Bucket, S3Key: !Ref LambdaCodeS3Key}
      Environment:
        Variables:
          ANALYZER_FUNCTION_NAME: !Ref AnalyzerFunction
          SCAN_INTERVAL_MINUTES: !Ref ScannerIntervalMinutes
          MAX_MODELS_PER_RUN: !Ref ScannerMaxModels
          MAX_ACTIVE_COUNT: !Ref MaxActiveItems
          MAX_CLOSED_COUNT: !Ref DefaultSearchCount
          ENABLE_SCHEDULED_SCAN: !Ref ScannerEnabled
          DISPATCH_INTERVAL_SECONDS: "10"
          STARTUP_JITTER_SECONDS: "15"

  # ============================================
  # Scanner Schedule
  # ============================================
  ScannerSchedule:
    Condition: DeployScannerCond
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "CatalogScanner-Schedule-${Environment}"
      ScheduleExpression: !Sub "rate(${ScannerIntervalMinutes} minutes)"
      State: !If [ScannerEnabledCond, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt ScannerFunction.Arn; Id: "Scanner"

  ScannerInvokePermission:
    Condition: DeployScannerCond
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScannerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScannerSchedule.Arn

Outputs:
  ClosedTableName:  Condition: DeployScraperCond; Value: !Ref ClosedTable
  ActiveTableName:  Condition: DeployScraperCond; Value: !Ref ActiveTable
  ScraperFunction:  Condition: DeployScraperCond; Value: !Ref ScraperFunction
  AnalyzerFunction: Condition: DeployScraperCond; Value: !Ref AnalyzerFunction
  ScannerFunction:  Condition: DeployScannerCond; Value: !Ref ScannerFunction
