name: 部署应用

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'cloudformation/**'
      - 'requirements.txt'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: '环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

      deployment_mode:
        description: '部署方式（自动会在模板变更时完整部署）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - code
          - all
      
      s3_bucket:
        description: 'Lambda代码的S3存储桶'
        required: true
        type: string
        default: 'productcatalog-lambda-code-767076981380'
      
      update_auction:
        description: '更新 Yahoo Auction Scraper'
        required: true
        default: true
        type: boolean
      
      update_analyzer:
        description: '更新 Yahoo Auction Analyzer'
        required: true
        default: true
        type: boolean
      
      update_catalog:
        description: '更新 ProductCatalog Discovery'
        required: true
        default: true
        type: boolean
      
      update_catalog_scanner:
        description: '更新 Catalog Scanner'
        required: true
        default: true
        type: boolean

      update_link_crawler:
        description: '更新 Yahoo Auction Link Crawler'
        required: true
        default: true
        type: boolean

      update_final_check:
        description: '更新 Yahoo Auction Final Check Reminder'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME_PREFIX: productcatalog-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 检查部署模式和环境
        id: check
        run: |
          # 确定部署模式和环境
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ENVIRONMENT="dev"
            # 自动触发时检查 CloudFormation 是否变更
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^cloudformation/'; then
              DEPLOY_ALL="true"
            else
              DEPLOY_ALL="false"
            fi
          else
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            if [[ "${{ github.event.inputs.deployment_mode }}" == "all" ]]; then
              DEPLOY_ALL="true"
            elif [[ "${{ github.event.inputs.deployment_mode }}" == "auto" ]]; then
              # 手动触发 auto 模式：检查最近一次提交
              if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^cloudformation/'; then
                DEPLOY_ALL="true"
              else
                DEPLOY_ALL="false"
              fi
            else
              # code 模式：仅更新代码
              DEPLOY_ALL="false"
            fi
          fi

          # 确定需要更新的函数
          if [[ "${{ github.event_name }}" == "push" || "$DEPLOY_ALL" == "true" ]]; then
            UPDATE_AUCTION="true"
            UPDATE_ANALYZER="true"
            UPDATE_CATALOG="true"
            UPDATE_CATALOG_SCANNER="true"
            UPDATE_LINK_CRAWLER="true"
            UPDATE_FINAL_CHECK="true"
          else
            UPDATE_AUCTION="${{ github.event.inputs.update_auction }}"
            UPDATE_ANALYZER="${{ github.event.inputs.update_analyzer }}"
            UPDATE_CATALOG="${{ github.event.inputs.update_catalog }}"
            UPDATE_CATALOG_SCANNER="${{ github.event.inputs.update_catalog_scanner }}"
            UPDATE_LINK_CRAWLER="${{ github.event.inputs.update_link_crawler }}"
            UPDATE_FINAL_CHECK="${{ github.event.inputs.update_final_check }}"
          fi

          # 构建需要更新的函数列表
          NEED_BUILD="false"
          if [[ "$UPDATE_AUCTION" == "true" ]] || [[ "$UPDATE_ANALYZER" == "true" ]] || \
             [[ "$UPDATE_CATALOG" == "true" ]] || [[ "$UPDATE_CATALOG_SCANNER" == "true" ]] || \
             [[ "$UPDATE_LINK_CRAWLER" == "true" ]] || [[ "$UPDATE_FINAL_CHECK" == "true" ]]; then
            NEED_BUILD="true"
          fi

          echo "=========================================="
          echo "部署配置："
          echo "  环境: $ENVIRONMENT"
          echo "  完整部署: $DEPLOY_ALL"
          echo "  需要构建: $NEED_BUILD"
          echo "=========================================="

          # 输出到环境变量
          echo "environment=$ENVIRONMENT" >> $GITHUB_ENV
          echo "deploy_all=$DEPLOY_ALL" >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED_BUILD" >> "$GITHUB_OUTPUT"
          echo "update_auction=$UPDATE_AUCTION" >> "$GITHUB_OUTPUT"
          echo "update_analyzer=$UPDATE_ANALYZER" >> "$GITHUB_OUTPUT"
          echo "update_catalog=$UPDATE_CATALOG" >> "$GITHUB_OUTPUT"
          echo "update_catalog_scanner=$UPDATE_CATALOG_SCANNER" >> "$GITHUB_OUTPUT"
          echo "update_link_crawler=$UPDATE_LINK_CRAWLER" >> "$GITHUB_OUTPUT"
          echo "update_final_check=$UPDATE_FINAL_CHECK" >> "$GITHUB_OUTPUT"

      - name: 构建 Lambda 包
        if: steps.check.outputs.need_build == 'true'
        run: |
          echo "🔨 正在构建 Lambda 包..."
          chmod +x build.sh
          ./build.sh
          echo "✅ 构建完成"
          ls -lh lambda.zip

      - name: 配置 AWS 凭证
        if: steps.check.outputs.need_build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767076981380:role/twoHands-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: 上传到 S3
        if: steps.check.outputs.need_build == 'true'
        id: upload
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_BUCKET="${{ github.event.inputs.s3_bucket || 'productcatalog-lambda-code-767076981380' }}"
          S3_KEY="productcatalog/lambda-${TIMESTAMP}.zip"
          
          echo "📤 正在上传 Lambda 代码到 S3..."
          echo "  存储桶: $S3_BUCKET"
          echo "  对象键: $S3_KEY"
          
          aws s3 cp lambda.zip "s3://${S3_BUCKET}/${S3_KEY}" --no-progress
          
          # 验证上传
          if aws s3 ls "s3://${S3_BUCKET}/${S3_KEY}" > /dev/null 2>&1; then
            echo "✅ 上传成功"
          else
            echo "❌ 上传失败"
            exit 1
          fi
          
          echo "s3_key=$S3_KEY" >> $GITHUB_ENV
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_ENV

      - name: 验证 CloudFormation 模板
        if: steps.check.outputs.deploy_all == 'true'
        run: |
          echo "🔎 正在验证 CloudFormation 模板..."
          aws cloudformation validate-template \
            --template-body file://cloudformation/productcatalog.yaml
          echo "✅ 模板验证通过"

      - name: 完整部署 CloudFormation 堆栈
        if: steps.check.outputs.deploy_all == 'true'
        id: deploy
        run: |
          STACK_NAME="${{ env.STACK_NAME_PREFIX }}-${{ env.environment }}"
          echo "🚀 正在部署 CloudFormation 堆栈: $STACK_NAME"
          echo "  S3 Bucket: ${{ env.s3_bucket }}"
          echo "  S3 Key: ${{ env.s3_key }}"

          set +e
          aws cloudformation deploy \
            --template-file cloudformation/productcatalog.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              "Environment=${{ env.environment }}" \
              "LambdaCodeS3Bucket=${{ env.s3_bucket }}" \
              "LambdaCodeS3Key=${{ env.s3_key }}" \
              "GeminiApiKey=${{ secrets.GEMINI_API_KEY }}" \
              "DoubaoApiKey=${{ secrets.DOUBAO_API_KEY }}" \
              "OpenaiApiKey=${{ secrets.OPENAI_API_KEY }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            2>&1 | tee deploy.log
          DEPLOY_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            echo "::error::CloudFormation 部署失败"
            echo ""
            echo "📋 失败资源详情:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query "reverse(StackEvents)[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table || true
            exit "$DEPLOY_STATUS"
          fi

          echo "✅ CloudFormation 部署成功"

      - name: 显示堆栈输出
        if: steps.check.outputs.deploy_all == 'true'
        run: |
          echo "📊 堆栈输出:"
          echo ""
          aws cloudformation describe-stacks \
            --stack-name "${{ env.STACK_NAME_PREFIX }}-${{ env.environment }}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: 更新 Lambda 函数代码
        if: steps.check.outputs.deploy_all != 'true' && steps.check.outputs.need_build == 'true'
        run: |
          echo "🔄 正在更新 Lambda 函数代码..."
          echo ""

          # 函数名映射
          declare -A FUNCTIONS=(
            ["auction"]="YahooAuctionScraper"
            ["analyzer"]="YahooAuctionAnalyzer"
            ["catalog"]="ProductCatalog-Discovery"
            ["catalog_scanner"]="CatalogScanner"
            ["link_crawler"]="YahooAuctionLinkCrawler"
            ["final_check"]="YahooAuctionFinalCheckReminder"
          )

          # 更新状态映射
          declare -A UPDATES=(
            ["auction"]="${{ steps.check.outputs.update_auction }}"
            ["analyzer"]="${{ steps.check.outputs.update_analyzer }}"
            ["catalog"]="${{ steps.check.outputs.update_catalog }}"
            ["catalog_scanner"]="${{ steps.check.outputs.update_catalog_scanner }}"
            ["link_crawler"]="${{ steps.check.outputs.update_link_crawler }}"
            ["final_check"]="${{ steps.check.outputs.update_final_check }}"
          )

          UPDATED_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0

          for KEY in "${!FUNCTIONS[@]}"; do
            if [[ "${UPDATES[$KEY]}" == "true" ]]; then
              FUNCTION_NAME="${FUNCTIONS[$KEY]}-${{ env.environment }}"
              echo "📦 正在更新 $FUNCTION_NAME..."
              
              # 检查函数是否存在
              if aws lambda get-function --function-name "$FUNCTION_NAME" --no-cli-pager >/dev/null 2>&1; then
                if aws lambda update-function-code \
                  --function-name "$FUNCTION_NAME" \
                  --s3-bucket "${{ env.s3_bucket }}" \
                  --s3-key "${{ env.s3_key }}" \
                  --no-cli-pager >/dev/null 2>&1; then
                  
                  # 等待更新完成
                  echo "   ⏳ 等待函数更新完成..."
                  aws lambda wait function-updated \
                    --function-name "$FUNCTION_NAME" \
                    --no-cli-pager
                  
                  echo "   ✅ $FUNCTION_NAME 更新完成"
                  UPDATED_COUNT=$((UPDATED_COUNT + 1))
                else
                  echo "   ❌ $FUNCTION_NAME 更新失败"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                fi
              else
                echo "   ⚠️ $FUNCTION_NAME 不存在，跳过"
                SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              fi
              echo ""
            fi
          done

          echo "=========================================="
          echo "📊 Lambda 更新汇总:"
          echo "  成功: $UPDATED_COUNT"
          echo "  跳过: $SKIPPED_COUNT"
          echo "  失败: $FAILED_COUNT"
          echo "=========================================="

          if [[ "$FAILED_COUNT" -gt 0 ]]; then
            echo "::error::部分 Lambda 函数更新失败"
            exit 1
          fi

      - name: 部署成功汇总
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 部署成功！"
          echo "=========================================="
          echo "环境: ${{ env.environment }}"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "方式: $([ '${{ steps.check.outputs.deploy_all }}' == 'true' ] && echo '完整部署 (CloudFormation + Lambda)' || echo '代码更新 (Lambda)')"
          echo "包路径: s3://${{ env.s3_bucket }}/${{ env.s3_key }}"
          echo "=========================================="

      - name: 部署失败通知
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ 部署失败"
          echo "=========================================="
          echo "环境: ${{ env.environment }}"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "请检查上方日志获取详细错误信息"
          echo "=========================================="
