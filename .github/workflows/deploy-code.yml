name: 部署应用

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'cloudformation/**'
      - 'requirements.txt'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: '环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

      deployment_mode:
        description: '部署方式（自动会在模板变更时完整部署）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - code
          - all
      
      s3_bucket:
        description: 'Lambda代码的S3存储桶'
        required: true
        type: string
        default: 'productcatalog-lambda-code-767076981380'
      
      update_auction:
        description: '更新 Yahoo Auction Scraper'
        required: true
        default: true
        type: boolean
      
      update_analyzer:
        description: '更新 Yahoo Auction Analyzer'
        required: true
        default: true
        type: boolean
      
      update_catalog:
        description: '更新 ProductCatalog Discovery'
        required: true
        default: true
        type: boolean
      
      update_catalog_scanner:
        description: '更新 Catalog Scanner'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-code:
    runs-on: ubuntu-latest
    # 自动触发时默认用 dev 环境，手动触发时用选择的环境
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 检查是否需要构建
        id: check
        run: |
          # CloudFormation 有变化时必须更新堆栈和全部 Lambda；仅代码变化时
          # 直接更新 Lambda 代码，避免一次不必要且较慢的堆栈部署。
          DEPLOY_ALL="false"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^cloudformation/'; then
              DEPLOY_ALL="true"
            fi
          elif [[ "${{ github.event.inputs.deployment_mode }}" == "all" ]]; then
            DEPLOY_ALL="true"
          elif [[ "${{ github.event.inputs.deployment_mode }}" == "auto" ]] && \
               git diff --name-only HEAD^ HEAD | grep -q '^cloudformation/'; then
            DEPLOY_ALL="true"
          fi

          # 自动触发时更新所有函数，手动触发时按选择
          if [[ "${{ github.event_name }}" == "push" || "$DEPLOY_ALL" == "true" ]]; then
            UPDATE_AUCTION="true"
            UPDATE_ANALYZER="true"
            UPDATE_CATALOG="true"
            UPDATE_CATALOG_SCANNER="true"
            ENVIRONMENT="dev"
          else
            UPDATE_AUCTION="${{ github.event.inputs.update_auction }}"
            UPDATE_ANALYZER="${{ github.event.inputs.update_analyzer }}"
            UPDATE_CATALOG="${{ github.event.inputs.update_catalog }}"
            UPDATE_CATALOG_SCANNER="${{ github.event.inputs.update_catalog_scanner }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_ENV
          echo "deploy_all=$DEPLOY_ALL" >> "$GITHUB_OUTPUT"
          echo "完整部署: $DEPLOY_ALL"
          
          NEED_BUILD="false"
          BUILD_REASONS=""
          
          if [[ "$UPDATE_AUCTION" == "true" ]]; then
            echo "✅ 需要更新 Yahoo Auction Scraper"
            NEED_BUILD="true"
            BUILD_REASONS="${BUILD_REASONS} AuctionScraper"
          fi
          
          if [[ "$UPDATE_ANALYZER" == "true" ]]; then
            echo "✅ 需要更新 Yahoo Auction Analyzer"
            NEED_BUILD="true"
            BUILD_REASONS="${BUILD_REASONS} Analyzer"
          fi
          
          if [[ "$UPDATE_CATALOG" == "true" ]]; then
            echo "✅ 需要更新 ProductCatalog Discovery"
            NEED_BUILD="true"
            BUILD_REASONS="${BUILD_REASONS} Catalog"
          fi
          
          if [[ "$UPDATE_CATALOG_SCANNER" == "true" ]]; then
            echo "✅ 需要更新 Catalog Scanner"
            NEED_BUILD="true"
            BUILD_REASONS="${BUILD_REASONS} CatalogScanner"
          fi
          
          echo "need_build=$NEED_BUILD" >> $GITHUB_OUTPUT
          echo "update_auction=$UPDATE_AUCTION" >> $GITHUB_OUTPUT
          echo "update_analyzer=$UPDATE_ANALYZER" >> $GITHUB_OUTPUT
          echo "update_catalog=$UPDATE_CATALOG" >> $GITHUB_OUTPUT
          echo "update_catalog_scanner=$UPDATE_CATALOG_SCANNER" >> $GITHUB_OUTPUT

      - name: 构建 Lambda 包
        if: steps.check.outputs.need_build == 'true'
        run: |
          echo "🔨 正在构建 Lambda 包..."
          chmod +x build.sh
          ./build.sh

      - name: 配置 AWS 凭证
        if: steps.check.outputs.need_build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767076981380:role/twoHands-GitHubActions-Role
          aws-region: ap-northeast-1

      - name: 上传到 S3
        if: steps.check.outputs.need_build == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_BUCKET="${{ github.event.inputs.s3_bucket || 'productcatalog-lambda-code-767076981380' }}"
          S3_KEY="productcatalog/lambda-${TIMESTAMP}.zip"
          
          echo "📤 正在上传 Lambda 代码到 S3..."
          aws s3 cp lambda.zip "s3://$S3_BUCKET/$S3_KEY"
          
          if aws s3 ls "s3://$S3_BUCKET/$S3_KEY" > /dev/null 2>&1; then
            echo "✅ 上传成功"
          else
            echo "❌ 上传失败"
            exit 1
          fi
          
          echo "s3_key=$S3_KEY" >> $GITHUB_ENV
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_ENV

      - name: 验证 CloudFormation 模板
        if: steps.check.outputs.deploy_all == 'true'
        run: |
          echo "🔎 正在验证 CloudFormation 模板..."
          aws cloudformation validate-template \
            --template-body file://cloudformation/productcatalog.yaml >/dev/null

      - name: 完整部署 CloudFormation 和 Lambda
        if: steps.check.outputs.deploy_all == 'true'
        run: |
          STACK_NAME="productcatalog-app-${{ env.environment }}"
          echo "🚀 模板已变更，正在完整部署 $STACK_NAME..."

          set +e
          aws cloudformation deploy \
            --template-file cloudformation/productcatalog.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              "Environment=${{ env.environment }}" \
              "LambdaCodeS3Bucket=${{ env.s3_bucket }}" \
              "LambdaCodeS3Key=${{ env.s3_key }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          DEPLOY_STATUS=$?
          set -e

          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            echo "::error::CloudFormation 部署失败，下面显示失败资源及具体原因。"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table || true
            exit "$DEPLOY_STATUS"
          fi

      - name: 显示堆栈输出
        if: steps.check.outputs.deploy_all == 'true'
        run: |
          aws cloudformation describe-stacks \
            --stack-name "productcatalog-app-${{ env.environment }}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: 更新 Yahoo Auction Scraper 函数
        if: steps.check.outputs.deploy_all != 'true' && steps.check.outputs.need_build == 'true' && steps.check.outputs.update_auction == 'true'
        run: |
          FUNCTION_NAME="YahooAuctionScraper-${{ env.environment }}"
          echo "🔄 正在更新 $FUNCTION_NAME..."
          
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "${{ env.s3_bucket }}" \
              --s3-key "${{ env.s3_key }}"
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "✅ $FUNCTION_NAME 更新完成"
          else
            echo "⚠️ 函数 $FUNCTION_NAME 不存在，跳过"
          fi

      - name: 更新 Yahoo Auction Analyzer 函数
        if: steps.check.outputs.deploy_all != 'true' && steps.check.outputs.need_build == 'true' && steps.check.outputs.update_analyzer == 'true'
        run: |
          FUNCTION_NAME="YahooAuctionAnalyzer-${{ env.environment }}"
          echo "🔄 正在更新 $FUNCTION_NAME..."
          
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "${{ env.s3_bucket }}" \
              --s3-key "${{ env.s3_key }}"
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "✅ $FUNCTION_NAME 更新完成"
          else
            echo "⚠️ 函数 $FUNCTION_NAME 不存在，跳过"
          fi

      - name: 更新 ProductCatalog Discovery 函数
        if: steps.check.outputs.deploy_all != 'true' && steps.check.outputs.need_build == 'true' && steps.check.outputs.update_catalog == 'true'
        run: |
          FUNCTION_NAME="ProductCatalog-Discovery-${{ env.environment }}"
          echo "🔄 正在更新 $FUNCTION_NAME..."
          
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "${{ env.s3_bucket }}" \
              --s3-key "${{ env.s3_key }}"
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "✅ $FUNCTION_NAME 更新完成"
          else
            echo "⚠️ 函数 $FUNCTION_NAME 不存在，跳过"
          fi

      - name: 更新 Catalog Scanner 函数
        if: steps.check.outputs.deploy_all != 'true' && steps.check.outputs.need_build == 'true' && steps.check.outputs.update_catalog_scanner == 'true'
        run: |
          FUNCTION_NAME="CatalogScanner-${{ env.environment }}"
          echo "🔄 正在更新 $FUNCTION_NAME..."
          
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "${{ env.s3_bucket }}" \
              --s3-key "${{ env.s3_key }}"
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "✅ $FUNCTION_NAME 更新完成"
          else
            echo "⚠️ 函数 $FUNCTION_NAME 不存在，跳过"
          fi

      - name: 部署成功
        if: success()
        run: |
          echo "=========================================="
          echo "✅ 部署成功！"
          echo "环境: ${{ env.environment }}"
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "包路径: s3://${{ env.s3_bucket }}/${{ env.s3_key }}"
          echo "=========================================="
