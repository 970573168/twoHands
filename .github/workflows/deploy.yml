name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod

      deploy_main_app:
        description: "Deploy Main Application?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      deploy_scraper:
        description: "Deploy Yahoo Auction Scraper & Analyzer?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      deploy_catalog_scanner:
        description: "Deploy Catalog Scanner?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      catalog_scanner_enabled:
        description: "Enable scheduled scanning? (default: false)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      catalog_scanner_interval:
        description: "Scan interval in minutes"
        required: false
        default: "120"
        type: string

      catalog_scanner_max_models:
        description: "Max models per scan"
        required: false
        default: "3"
        type: string

      s3_bucket:
        description: "S3 bucket name for Lambda code"
        required: true
        default: "productcatalog-lambda-code"
        type: string

      max_pages:
        description: "Yahoo Auction max pages to scrape"
        required: false
        default: "1"
        type: string

      log_retention:
        description: "CloudWatch log retention days"
        required: false
        default: "14"
        type: string

      stack_params:
        description: "Additional CloudFormation params JSON (overrides defaults)"
        required: false
        default: "{}"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      DEPLOY_MAIN_APP: ${{ inputs.deploy_main_app || 'true' }}
      DEPLOY_SCRAPER: ${{ inputs.deploy_scraper || 'true' }}
      DEPLOY_CATALOG_SCANNER: ${{ inputs.deploy_catalog_scanner || 'true' }}
      CATALOG_SCANNER_ENABLED: ${{ inputs.catalog_scanner_enabled || 'false' }}
      CATALOG_SCANNER_INTERVAL: ${{ inputs.catalog_scanner_interval || '120' }}
      CATALOG_SCANNER_MAX_MODELS: ${{ inputs.catalog_scanner_max_models || '3' }}
      S3_BUCKET_PREFIX: ${{ inputs.s3_bucket || 'productcatalog-lambda-code' }}
      YAHOO_AUCTION_MAX_PAGES: ${{ inputs.max_pages || '1' }}
      LOG_RETENTION_DAYS: ${{ inputs.log_retention || '14' }}
      EXTRA_STACK_PARAMS: ${{ inputs.stack_params || '{}' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767076981380:role/twoHands-GitHubActions-Role
          aws-region: ap-northeast-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          echo "AWS_REGION=ap-northeast-1" >> "$GITHUB_ENV"

      - name: Prepare S3 Bucket Name
        run: |
          S3_BUCKET="${S3_BUCKET_PREFIX}-${AWS_ACCOUNT_ID}"
          echo "S3_BUCKET=$S3_BUCKET" >> "$GITHUB_ENV"

      - name: Create S3 Bucket if not exists
        if: ${{ env.DEPLOY_MAIN_APP == 'true' || env.DEPLOY_SCRAPER == 'true' || env.DEPLOY_CATALOG_SCANNER == 'true' }}
        run: |
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "Bucket exists: $S3_BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$S3_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
          aws s3api put-bucket-versioning --bucket "$S3_BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$S3_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$S3_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Build and Upload Lambda Code
        if: ${{ env.DEPLOY_MAIN_APP == 'true' || env.DEPLOY_SCRAPER == 'true' || env.DEPLOY_CATALOG_SCANNER == 'true' }}
        run: |
          BUILD_DIR="build"
          rm -rf "$BUILD_DIR" lambda.zip
          mkdir -p "$BUILD_DIR"
          
          pip3 install requests beautifulsoup4 boto3 -t "$BUILD_DIR" \
            --platform manylinux2014_aarch64 --only-binary=:all: --python-version 3.12 --quiet
          
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt -t "$BUILD_DIR" \
              --platform manylinux2014_aarch64 --only-binary=:all: --python-version 3.12 --quiet
          fi
          
          # 复制所有 Python 文件（支持多个 Lambda 函数）
          for d in src lambda; do
            if [ -d "$d" ] && [ -n "$(ls -A $d/*.py 2>/dev/null)" ]; then
              cp $d/*.py "$BUILD_DIR/" && break
            fi
          done
          
          cd "$BUILD_DIR" && zip -r9 ../lambda.zip . -q && cd ..
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          S3_KEY="productcatalog/lambda-${TIMESTAMP}.zip"
          aws s3 cp lambda.zip "s3://$S3_BUCKET/$S3_KEY"
          echo "S3_KEY=$S3_KEY" >> "$GITHUB_ENV"

      - name: Deploy Stack
        run: |
          STACK_NAME="productcatalog-app-${DEPLOY_ENVIRONMENT}"
          
          PARAMS=(
            "Environment=${DEPLOY_ENVIRONMENT}"
            "DeployMainApp=${DEPLOY_MAIN_APP}"
            "DeployScraper=${DEPLOY_SCRAPER}"
            "LambdaCodeS3Bucket=$S3_BUCKET"
            "LambdaCodeS3Key=${S3_KEY:-productcatalog/lambda.zip}"
            "YahooAuctionMaxPages=${YAHOO_AUCTION_MAX_PAGES}"
            "LogRetentionDays=${LOG_RETENTION_DAYS}"
            "AiMaxRetries=3"
          )
          
          # 添加 Catalog Scanner 参数
          if [ "$DEPLOY_CATALOG_SCANNER" = "true" ]; then
            PARAMS+=(
              "DeployCatalogScanner=true"
              "CatalogScannerEnabled=${CATALOG_SCANNER_ENABLED}"
              "CatalogScannerIntervalMinutes=${CATALOG_SCANNER_INTERVAL}"
              "CatalogScannerMaxModels=${CATALOG_SCANNER_MAX_MODELS}"
            )
          else
            PARAMS+=("DeployCatalogScanner=false")
          fi
          
          # 🔧 修复: stack_params 使用 Key=Value 格式
          EXTRA_PARAMS="$EXTRA_STACK_PARAMS"
          if [ "$EXTRA_PARAMS" != "{}" ]; then
            while IFS="=" read -r k v; do
              [ -n "$k" ] && PARAMS+=("$k=$v")
            done < <(echo "$EXTRA_PARAMS" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          fi
          
          # 🔍 调试: 打印所有参数
          echo "========== Deployment Parameters =========="
          printf '%s\n' "${PARAMS[@]}"
          echo "==========================================="
          
          aws cloudformation deploy \
            --template-file cloudformation/productcatalog.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides "${PARAMS[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "productcatalog-app-${DEPLOY_ENVIRONMENT}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Show Failed Resources
        if: failure()
        run: |
          STACK_NAME="productcatalog-app-${DEPLOY_ENVIRONMENT}"
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceStatus,ResourceStatusReason,Timestamp]" \
              --output table
          else
            echo "Stack $STACK_NAME does not exist; no stack events to display."
          fi
